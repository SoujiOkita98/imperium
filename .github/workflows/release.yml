name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skill structure
        run: |
          if [ ! -f "skill/SKILL.md" ]; then
            echo "Error: skill/SKILL.md not found" >&2
            exit 1
          fi
          echo "✓ Skill structure valid"

      - name: Package .skill file
        run: |
          # Package only the skill/ directory as .skill (zip)
          cd skill
          zip -r ../imperium.skill .
          cd ..
          ls -la imperium.skill
          unzip -l imperium.skill

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: imperium.skill
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
